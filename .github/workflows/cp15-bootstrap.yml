name: CP15 live runtime lifecycle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  cp15:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Host prerequisites
        run: |
          docker version
          python3 --version
          sudo apt-get update
          sudo apt-get install -y openssh-client jq
          sudo rm -rf /var/lib/apt/lists/*

      - name: Checkout CP15 harness
        uses: actions/checkout@v4
        with:
          ref: cp15-runtime-lifecycle

      - name: Checkout pinned NVIDIA OpenShell
        run: |
          git clone --filter=blob:none https://github.com/NVIDIA/OpenShell.git upstream
          git -C upstream checkout 484f0768fc6a0d93e0a2be295c1679aed24e18a9
          test "$(git -C upstream rev-parse HEAD)" = "484f0768fc6a0d93e0a2be295c1679aed24e18a9"

      - name: Apply CP15 integration
        run: |
          python3 openshell_cp15/apply_cp15.py upstream
          git -C upstream diff --check
          git -C upstream diff --stat

      - name: Use pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustc +1.95.0 --version
          cargo +1.95.0 --version

      - name: Rustfmt
        working-directory: upstream
        run: cargo +1.95.0 fmt --all

      - name: Cargo check runtime crates
        working-directory: upstream
        run: cargo +1.95.0 check -p openshell-supervisor-network -p openshell-supervisor-process -p openshell-supervisor -p openshell-driver-docker

      - name: Compile CP15 e2e test
        working-directory: upstream
        run: cargo +1.95.0 test --manifest-path e2e/rust/Cargo.toml --features e2e-docker --test cp15_blackbox_runtime --no-run

      - name: Run live Docker gateway supervisor sandbox lifecycle
        working-directory: upstream
        env:
          OPENSHELL_BLACKBOX_E2E_EVIDENCE: "1"
          OPENSHELL_E2E_DOCKER_TEST: cp15_blackbox_runtime
          OPENSHELL_DOCKER_SUPERVISOR_IMAGE: openshell/supervisor:dev
          OPENSHELL_DOCKER_SANDBOX_RUNTIME_IMAGE: openshell/sandbox:dev
        run: bash e2e/rust/e2e-docker.sh
