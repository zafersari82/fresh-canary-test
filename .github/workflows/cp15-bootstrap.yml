name: CP15 full runtime E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp15:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENSHELL_DOCKER_SUPERVISOR_IMAGE: openshell/supervisor:dev
      OPENSHELL_DOCKER_SANDBOX_RUNTIME_IMAGE: openshell/sandbox:dev
    steps:
      - name: Checkout CP15 branch
        uses: actions/checkout@v4
        with:
          ref: cp15-full-runtime-e2e

      - name: Checkout pinned NVIDIA OpenShell
        run: |
          git clone --filter=blob:none https://github.com/NVIDIA/OpenShell.git upstream
          git -C upstream checkout 484f0768fc6a0d93e0a2be295c1679aed24e18a9
          test "$(git -C upstream rev-parse HEAD)" = "484f0768fc6a0d93e0a2be295c1679aed24e18a9"

      - name: Apply CP15 integration
        run: |
          python3 openshell_cp10/apply_cp10.py upstream
          git -C upstream diff --check
          git -C upstream diff --stat

      - name: Use pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustc +1.95.0 --version
          cargo +1.95.0 --version

      - name: Rustfmt
        working-directory: upstream
        run: |
          cargo +1.95.0 fmt --all
          git diff --check

      - name: Cargo check runtime and focused E2E
        working-directory: upstream
        run: |
          cargo +1.95.0 check             -p openshell-supervisor-network             -p openshell-supervisor-process             -p openshell-supervisor             -p openshell-driver-docker
          cargo +1.95.0 check             --manifest-path e2e/rust/Cargo.toml             --features e2e-docker             --test blackbox_acv_runtime

      - name: Docker preflight
        run: |
          docker version
          docker info
          docker run --rm hello-world >/dev/null

      - name: Run real Docker gateway supervisor sandbox lifecycle
        working-directory: upstream
        run: |
          bash e2e/with-docker-gateway.sh             cargo +1.95.0 test               --manifest-path e2e/rust/Cargo.toml               --features e2e-docker               --test blackbox_acv_runtime               -- --nocapture
