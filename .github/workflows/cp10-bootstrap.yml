name: CP10 bootstrap runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp10:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout CP10 harness branch
        uses: actions/checkout@v4
        with:
          ref: cp10-openshell-ci

      - name: Checkout pinned NVIDIA OpenShell
        run: |
          git clone --filter=blob:none https://github.com/NVIDIA/OpenShell.git upstream
          git -C upstream checkout 484f0768fc6a0d93e0a2be295c1679aed24e18a9
          test "$(git -C upstream rev-parse HEAD)" = "484f0768fc6a0d93e0a2be295c1679aed24e18a9"

      - name: Apply BLACKBOX CP10 integration
        run: |
          python3 openshell_cp10/apply_cp10.py upstream
          git -C upstream diff --check
          git -C upstream diff --stat

      - name: Use OpenShell pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustc +1.95.0 --version
          cargo +1.95.0 --version

      - name: Rustfmt normalize
        working-directory: upstream
        run: |
          cargo +1.95.0 fmt --all
          git diff --check

      - name: Cargo check affected crates
        working-directory: upstream
        run: cargo +1.95.0 check -p openshell-supervisor-network -p openshell-supervisor-process -p openshell-supervisor

      - name: CP10 Rust unit tests
        working-directory: upstream
        run: cargo +1.95.0 test -p openshell-supervisor-network durable_egress --lib -- --nocapture
