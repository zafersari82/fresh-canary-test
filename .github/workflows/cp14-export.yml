name: CP14 source export

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CP14 branch
        uses: actions/checkout@v4
        with:
          ref: cp14-hash-chain-witness

      - name: Checkout pinned OpenShell
        run: |
          git clone --filter=blob:none https://github.com/NVIDIA/OpenShell.git upstream
          git -C upstream checkout 484f0768fc6a0d93e0a2be295c1679aed24e18a9

      - name: Apply and export exact verified source
        run: |
          python3 openshell_cp10/apply_cp10.py upstream
          (cd upstream && cargo fmt --all)
          mkdir -p cp14-export
          cp upstream/crates/openshell-supervisor-network/src/durable_egress.rs cp14-export/durable_egress.rs
          git -C upstream diff --binary > cp14-export/CP14_OPENSHELL_PINNED.patch
          cat > cp14-export/SOURCE.txt <<'EOF'
          BLACKBOX branch: cp14-hash-chain-witness
          BLACKBOX branch commit: 7d4350ca278c00827828199a054e2cdcc252c5fc
          NVIDIA/OpenShell pin: 484f0768fc6a0d93e0a2be295c1679aed24e18a9
          Successful verification run: 35645787905
          Successful verification job: 106485793747
          Focused Rust tests: 29 passed, 0 failed, 1334 filtered out
          EOF

      - name: Upload exact CP14 source
        uses: actions/upload-artifact@v4
        with:
          name: cp14-exact-source
          path: cp14-export
